<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Echotect muuttaa todellisen maailman karttageometrian kuultaviksi kaiuiksi.">
  <title>Echotect</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://tile.openstreetmap.org">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Echotect</h1>
    </div>
    <form id="search-form" class="search" role="search">
      <label class="sr-only" for="location-input">Search for a place or enter coordinates</label>
      <input id="location-input" type="search" placeholder="Place, 60.1699, 24.9384, or Maps link" autocomplete="off">
      <button type="submit">Search</button>
    </form>
  </header>

  <main class="workspace">
    <section class="map-panel" aria-label="Map">
      <div id="map"></div>
      <div class="map-tools" aria-label="Map tools">
        <button type="button" data-tool="source"><span class="tool-symbol symbol-source" aria-hidden="true"></span>Set source</button>
        <button type="button" data-tool="listener"><span class="tool-symbol symbol-listener" aria-hidden="true"></span>Set listener</button>
        <button type="button" data-tool="reflector"><span class="tool-symbol symbol-reflector" aria-hidden="true"></span>Add reflector</button>
      </div>
      <p id="map-hint" class="map-hint">Choose a tool, then select a location on the map.</p>
    </section>

    <aside class="side-panel">
      <section>
        <div class="section-heading">
          <div>
            <h2>Reflection field</h2>
          </div>
          <button id="clear-reflectors" class="text-button" type="button">Clear</button>
        </div>
        <dl class="points">
          <div><dt><span class="tool-symbol symbol-source" aria-hidden="true"></span>Source</dt><dd id="source-coordinates">–</dd></div>
          <div><dt><span class="tool-symbol symbol-listener" aria-hidden="true"></span>Listener</dt><dd id="listener-coordinates">–</dd></div>
        </dl>
        <button id="link-points" class="link-points" type="button" aria-pressed="false">
          <span class="link-symbol" aria-hidden="true">↔</span>
          <span class="link-label">Co-locate source and listener</span>
        </button>
        <div class="direct-path">
          <span>Direct sound</span>
          <strong id="direct-sound-metrics">–</strong>
        </div>
        <div id="reflection-list" class="reflection-list"></div>
        <p id="empty-reflections" class="empty-state">Add at least one reflector to see its distances and propagation time.</p>
      </section>

      <section class="audio-section">
        <h2>Listen to the geometry</h2>
        <label class="file-picker">
          <span>Choose your own sound</span>
          <input id="audio-file" type="file" accept="audio/*">
        </label>
        <p id="sound-name" class="sound-name">Sound: Echotect handclap</p>
        <div class="audio-actions">
          <button id="play-button" class="primary" type="button">Play impulse</button>
          <button id="default-sound" type="button">Use handclap</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
    </aside>
  </main>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
