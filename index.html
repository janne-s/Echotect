<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Echotect turns real-world map geometry into delay structures: audition in the browser, export impulse responses and stems, open in Max for Live.">
  <meta property="og:title" content="Echotect · Turn your hood into a delay">
  <meta property="og:description" content="Turn real-world map geometry into delay structures. Audition them in the browser, export stereo impulse responses and aligned WAV stems, or open the project in the Max for Live device.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://janne-s.github.io/Echotect/">
  <meta property="og:image" content="https://janne-s.github.io/Echotect/assets/ss_og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Echotect geographic echo design interface">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:creator" content="@JanneSarkela">
  <meta name="twitter:title" content="Echotect · Turn your hood into a delay">
  <meta name="twitter:description" content="Turn real-world map geometry into delay structures. Audition them in the browser, export stereo impulse responses and aligned WAV stems, or open the project in the Max for Live device.">
  <meta name="twitter:image" content="https://janne-s.github.io/Echotect/assets/ss_og.jpg">
  <meta name="twitter:image:alt" content="Echotect geographic echo design interface">
  <title>Echotect · Turn your hood into a delay</title>
  <link rel="canonical" href="https://janne-s.github.io/Echotect/">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://tile.openstreetmap.org">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
    integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-actions">
      <h1>Echotect</h1>
      <button id="export-button" class="primary" type="button">Export</button>
      <a class="github-link" href="https://github.com/janne-s/Echotect" target="_blank" rel="noopener noreferrer" aria-label="Echotect on GitHub" title="Echotect on GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 .7a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.3.8-.6v-2.2c-3.4.7-4.1-1.4-4.1-1.4-.5-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.8 5.4-5.5 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A11.5 11.5 0 0 0 12 .7Z"/>
        </svg>
      </a>
    </div>
    <form id="search-form" class="search" role="search">
      <label class="sr-only" for="location-input">Search for a place or enter coordinates</label>
      <input id="location-input" type="search" placeholder="Place, 60.1699, 24.9384, or Maps link" autocomplete="off">
      <button type="submit">Search</button>
      <button id="locate-button" type="button" title="Use browser location">
        <span aria-hidden="true">◎</span>
        <span>Locate me</span>
      </button>
    </form>
  </header>

  <main class="workspace">
    <section class="map-panel" aria-label="Map">
      <div id="map"></div>
      <div class="map-tools" aria-label="Map tools">
        <button type="button" data-tool="source"><span class="tool-symbol symbol-source" aria-hidden="true"></span>Set source</button>
        <button type="button" data-tool="listener"><span class="tool-symbol symbol-listener" aria-hidden="true"></span>Set listener</button>
        <button id="link-points" class="link-points" type="button" aria-pressed="false">
          <span class="link-label">Link</span>
          <span class="tool-symbol symbol-source" aria-hidden="true"></span>
          <span class="tool-symbol symbol-listener" aria-hidden="true"></span>
        </button>
        <button type="button" data-tool="reflector"><span class="tool-symbol symbol-reflector" aria-hidden="true"></span>Add reflector</button>
        <button id="buildings-button" type="button" aria-pressed="false" title="Load building data">Buildings</button>
        <button id="echo-field-button" type="button" aria-pressed="false" title="Load building data first" disabled>Echo field</button>
        <button id="echo-settings-button" class="icon-button" type="button" aria-label="Echo field settings" title="Echo field settings">⚙</button>
      </div>
    </section>

    <aside class="side-panel">
      <section class="audio-section">
        <label class="file-picker">
          <span>Choose your own sound</span>
          <input id="audio-file" type="file" accept="audio/*">
        </label>
        <p id="sound-name" class="sound-name">Sound: handclap.wav</p>
        <label class="solo-control">
          <input id="arrivals-only" type="checkbox">
          <span>Arrivals only</span>
        </label>
        <label class="panning-control">
          <span>Panning</span>
          <select id="panning-mode">
            <option value="spatial-stereo">Spatial stereo</option>
            <option value="hrtf-live">HRTF · live only</option>
          </select>
        </label>
        <label class="level-control heading-control">
          <span>
            Listener heading
            <span class="heading-readout">
              <output id="heading-value">0°</output>
              <span id="heading-arrow" class="heading-arrow" aria-hidden="true">↑</span>
            </span>
          </span>
          <input id="listener-heading" type="range" step="1">
        </label>
        <div class="audio-actions">
          <button id="play-button" class="primary" type="button">Play impulse</button>
          <button id="default-sound" type="button">Use handclap</button>
          <button id="reset-audio" type="button" title="Restart the audio engine if playback stops working.">Recover audio</button>
        </div>
      </section>

      <section>
        <div class="section-heading">
          <h2>Reflection field</h2>
          <label class="compact-select">
            <span class="sr-only">Global material</span>
            <select id="global-material" title="Global material">
              <option value="generic">Generic</option>
              <option value="concrete">Concrete</option>
              <option value="glass">Glass</option>
              <option value="brick">Brick</option>
              <option value="stone">Stone</option>
              <option value="metal">Metal</option>
              <option value="wood">Wood</option>
              <option value="vegetation">Vegetation</option>
            </select>
          </label>
          <button id="clear-reflectors" class="text-button" type="button">Clear</button>
        </div>
        <label class="level-control global-level">
          <span>Global reflection level <output id="global-level-value">−6 dB</output></span>
          <input id="global-level" type="range" step="1">
        </label>
        <div id="reflection-list" class="reflection-list"></div>
        <p id="empty-reflections" class="empty-state">Add at least one reflector to see its distances and propagation time.</p>
      </section>
    </aside>
  </main>

  <dialog id="confirmation-dialog" class="modal" tabindex="-1" aria-labelledby="confirmation-title" aria-describedby="confirmation-message">
    <form method="dialog">
      <h2 id="confirmation-title">Confirm action</h2>
      <p id="confirmation-message"></p>
      <div class="modal-actions">
        <button value="cancel" type="submit">Cancel</button>
        <button id="confirmation-submit" class="primary" value="confirm" type="submit">Confirm</button>
      </div>
    </form>
  </dialog>

  <dialog id="echo-settings-dialog" class="modal settings-modal" tabindex="-1" aria-labelledby="echo-settings-title">
    <form method="dialog">
      <h2 id="echo-settings-title">Echo field settings</h2>
      <div class="settings-grid">
        <label><span>Point reflections</span><select id="setting-point-mode"><option value="persistent">Persistent</option><option value="geometric">Geometric</option></select></label>
        <label data-point-mode="persistent"><span>Point persistence</span><span class="settings-control"><input id="setting-point-persistence" type="range"><output id="setting-point-persistence-value"></output></span></label>
        <label><span>Point bounces</span><span class="settings-control"><input id="setting-point-bounces" type="range"><output id="setting-point-bounces-value"></output></span></label>
        <label><span>Point path limit</span><span class="settings-control"><input id="setting-point-paths" type="range"><output id="setting-point-paths-value"></output></span></label>
        <label><span>Atmosphere</span><select id="setting-air-mode"><option value="standard">Standard</option><option value="custom">Custom</option><option value="off">Off</option></select></label>
        <label data-air-mode="custom"><span>Temperature</span><span class="settings-control"><input id="setting-air-temperature" type="range"><output id="setting-air-temperature-value"></output></span></label>
        <label data-air-mode="custom"><span>Relative humidity</span><span class="settings-control"><input id="setting-air-humidity" type="range"><output id="setting-air-humidity-value"></output></span></label>
        <label data-air-mode="custom"><span>Air pressure</span><span class="settings-control"><input id="setting-air-pressure" type="range"><output id="setting-air-pressure-value"></output></span></label>
        <label data-air-active><span>Air attenuation scale</span><span class="settings-control"><input id="setting-air-amount" type="range"><output id="setting-air-amount-value"></output></span></label>
        <label><span>Geometric spreading</span><span class="settings-control"><input id="setting-geometric-spreading" type="range"><output id="setting-geometric-spreading-value"></output></span></label>
        <label><span>Material absorption scale</span><span class="settings-control"><input id="setting-material-coloration" type="range"><output id="setting-material-coloration-value"></output></span></label>
        <label><span>Late field</span><select id="setting-late-mode"><option value="convolution">Convolution</option><option value="fdn">Feedback network</option></select></label>
        <label data-late-mode="convolution"><span>Response duration</span><span class="settings-control"><input id="setting-duration" type="range"><output id="setting-duration-value"></output></span></label>
        <label><span>Echo field surfaces</span><span class="settings-control"><input id="setting-surfaces" type="range"><output id="setting-surfaces-value"></output></span></label>
        <label data-late-mode="convolution"><span>Late path samples</span><span class="settings-control"><input id="setting-late-walks" type="range"><output id="setting-late-walks-value"></output></span></label>
        <label><span>Late field bounces</span><span class="settings-control"><input id="setting-bounces" type="range"><output id="setting-bounces-value"></output></span></label>
        <label><span>Cutoff level</span><span class="settings-control"><input id="setting-cutoff" type="range"><output id="setting-cutoff-value"></output></span></label>
        <label data-late-mode="convolution"><span>Tail persistence</span><span class="settings-control"><input id="setting-persistence" type="range"><output id="setting-persistence-value"></output></span></label>
        <label data-late-mode="fdn"><span>Tail length</span><span class="settings-control"><input id="setting-fdn-tail" type="range"><output id="setting-fdn-tail-value"></output></span></label>
        <label data-late-mode="fdn"><span>Density</span><span class="settings-control"><input id="setting-fdn-density" type="range"><output id="setting-fdn-density-value"></output></span></label>
        <label data-late-mode="fdn"><span>Damping</span><span class="settings-control"><input id="setting-fdn-damping" type="range"><output id="setting-fdn-damping-value"></output></span></label>
        <label data-late-mode="fdn"><span>Geometry influence</span><span class="settings-control"><input id="setting-geometry-influence" type="range"><output id="setting-geometry-influence-value"></output></span></label>
      </div>
      <div class="modal-actions">
        <button value="cancel" type="submit">Cancel</button>
        <button class="primary" value="save" type="submit">Save settings</button>
      </div>
    </form>
  </dialog>

  <dialog id="export-dialog" class="modal export-modal" tabindex="-1" aria-labelledby="export-title">
    <form id="export-form" method="dialog">
      <div class="section-heading"><h2 id="export-title">Export project</h2><button id="export-all" class="text-button" type="button">Select all</button></div>
      <label class="export-name"><span>Project name</span><input id="export-project-name" required maxlength="80"></label>
      <div class="export-list">
        <label><input type="checkbox" name="export-item" value="manifest" checked><span><strong>Project manifest</strong><small id="export-size-manifest"></small></span></label>
        <label><input type="checkbox" name="export-item" value="convolution" checked><span><strong>Convolution IR</strong><small id="export-size-convolution"></small></span></label>
        <label><input type="checkbox" name="export-item" value="fdn" checked><span><strong>Rendered FDN IR</strong><small id="export-size-fdn"></small></span></label>
        <label><input type="checkbox" name="export-item" value="wet" checked><span><strong>Wet render</strong><small id="export-size-wet"></small></span></label>
        <label><input type="checkbox" name="export-item" value="stems" checked><span><strong>Aligned stems</strong><small id="export-size-stems"></small></span></label>
      </div>
      <p class="export-contract">Stereo · 48 kHz · 32-bit float · no normalization or clipping</p>
      <p id="export-field-note" class="export-field-note"></p>
      <p id="export-summary" class="export-summary"></p>
      <p id="export-error" class="export-error" role="alert" hidden></p>
      <div class="modal-actions"><button value="cancel" type="submit">Cancel</button><button id="export-submit" class="primary" value="export" type="submit">Export selected</button></div>
    </form>
  </dialog>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"
    integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/pmtiles@4.4.1/dist/pmtiles.js"
    integrity="sha384-iS2/cbFYol4NsEeda4mW6N/8wPMOT6pv2eY+GNYSJRqVC4nbJECP1+mg6D2T8wT/" crossorigin="anonymous"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
